name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  # Keep in sync with the toolchain used for local verification.
  RUST_TOOLCHAIN: "1.95.0"

jobs:
  macos-bundle:
    name: macOS installer
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Fetch Bradbit sidecar
        run: npm run fetch:bradbit

      - name: Build the app bundle
        run: npm run tauri build -- --config src-tauri/tauri.sidecar.conf.json

      - name: Verify the bundled Bradbit sidecar
        run: test -x "src-tauri/target/release/bundle/macos/Bradbit Editor.app/Contents/MacOS/bradbit"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: bradbit-editor-macos
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Extract release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Publish pre-release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/dmg/*.dmg
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
