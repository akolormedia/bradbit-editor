name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  # Keep in sync with the toolchain used for local verification.
  RUST_TOOLCHAIN: "1.95.0"

jobs:
  macos-bundle:
    name: macOS installer
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Fetch universal Bradbit sidecar
        run: npm run sidecar:universal

      - name: Build the universal app bundle
        run: npm run tauri build -- --target universal-apple-darwin --config src-tauri/tauri.sidecar.conf.json

      - name: Verify both architectures and the signature
        run: |
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/Bradbit Editor.app"
          MAIN="$APP/Contents/MacOS/bradbit-editor"
          SIDECAR="$APP/Contents/MacOS/bradbit"
          test -x "$MAIN"
          test -x "$SIDECAR"
          lipo -archs "$MAIN" | tee /dev/stderr | grep -q "x86_64"
          lipo -archs "$MAIN" | grep -q "arm64"
          lipo -archs "$SIDECAR" | tee /dev/stderr | grep -q "x86_64"
          lipo -archs "$SIDECAR" | grep -q "arm64"
          "$SIDECAR" --version
          if arch -x86_64 /usr/bin/true >/dev/null 2>&1; then
            arch -x86_64 "$SIDECAR" --version
          else
            echo "Rosetta is not available; x86_64 execution skipped (slices verified with lipo)."
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"
          if codesign -dv --verbose=4 "$APP" 2>&1 | grep -q "linker-signed"; then
            echo "The app bundle still has the linker ad-hoc signature; macOS reports it as damaged." >&2
            exit 1
          fi

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: bradbit-editor-macos-universal
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Extract release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Publish pre-release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
