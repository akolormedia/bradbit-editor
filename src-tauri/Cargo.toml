[package]
name = "bradbit-editor"
version = "0.1.0-alpha.5"
description = "Bradbit Editor — Agnostic creative writing desktop editor"
authors = ["Bradbit"]
license = "MIT"
edition = "2021"

[lib]
name = "bradbit_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ureq = { version = "3", features = ["json"] }
dirs = "6"
pdf-writer = "0.15"
include_dir = "0.7"
keyring = "4"
notify-debouncer-mini = "0.7"
thiserror = "2"
portable-pty = "0.9.0"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSEvent", "block2"] }

[dev-dependencies]
tempfile = "3"
